[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["dependencies"]
# cartesi-rollups-contracts 3 requires solc ^0.8.30, targets prague, and only
# compiles through the IR pipeline (tests deploy its ApplicationFactory)
solc_version = "0.8.30"
evm_version = "prague"
optimizer = true
via_ir = true
ignored_warnings_from = ["dependencies"]

[profile.default.fuzz]
runs = 256

[profile.ci]
verbosity = 3

[profile.ci.fuzz]
runs = 10_000

[rpc_endpoints]
arbitrum = "${ARBITRUM_RPC_URL}"
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
mainnet = "${MAINNET_RPC_URL}"
optimism = "${OPTIMISM_RPC_URL}"
optimism_sepolia = "${OPTIMISM_SEPOLIA_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
arbitrum = { key = "${ETHERSCAN_API_KEY}", chain = "arbitrum" }
arbitrum_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = "arbitrum-sepolia" }
base = { key = "${ETHERSCAN_API_KEY}", chain = "base" }
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = "base-sepolia" }
mainnet = { key = "${ETHERSCAN_API_KEY}", chain = "mainnet" }
optimism = { key = "${ETHERSCAN_API_KEY}", chain = "optimism" }
optimism_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = "optimism-sepolia" }
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = "sepolia" }

[dependencies]
"@ensdomains-ens-contracts" = { version = "1.1.4", git = "https://github.com/ensdomains/ens-contracts.git", tag = "v1.1.4" }
"@openzeppelin-contracts" = "5.2.0"
cartesi-machine-solidity-step = { version = "0.15.0", git = "https://github.com/cartesi/machine-solidity-step.git", tag = "v0.15.0" }
cartesi-rollups-contracts = "3.0.0-alpha.10"
forge-std = "1.17.0"

[soldeer]
# remappings.txt is maintained by hand, to give dependencies stable import
# prefixes (cartesi-rollups-contracts also needs the versioned prefixes it uses)
remappings_generate = false
recursive_deps = false
