[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["dependencies"]
solc_version = "0.8.20"
evm_version = "paris"
# optimizer stays off, matching the compiler settings of the existing deployments
optimizer = false
ignored_warnings_from = ["dependencies"]
# tests check the deploy script against the rollups deployment records
fs_permissions = [
    { access = "read", path = "./dependencies/@cartesi-rollups-1.4.3/onchain/rollups/deployments" },
]

[profile.default.fuzz]
runs = 256

[profile.ci]
verbosity = 3

[profile.ci.fuzz]
runs = 10_000

[rpc_endpoints]
arbitrum = "${ARBITRUM_RPC_URL}"
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
mainnet = "${MAINNET_RPC_URL}"
optimism = "${OPTIMISM_RPC_URL}"
optimism_sepolia = "${OPTIMISM_SEPOLIA_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
arbitrum = { key = "${ETHERSCAN_API_KEY}", chain = "arbitrum" }
arbitrum_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = "arbitrum-sepolia" }
base = { key = "${ETHERSCAN_API_KEY}", chain = "base" }
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = "base-sepolia" }
mainnet = { key = "${ETHERSCAN_API_KEY}", chain = "mainnet" }
optimism = { key = "${ETHERSCAN_API_KEY}", chain = "optimism" }
optimism_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = "optimism-sepolia" }
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = "sepolia" }

[dependencies]
"@openzeppelin-contracts" = "4.9.3"
forge-std = "1.17.0"
"@cartesi-rollups" = { version = "1.4.3", git = "https://github.com/cartesi/rollups-contracts.git", tag = "v1.4.3" }
"@cartesi-util" = { version = "6.3.0", git = "https://github.com/cartesi/solidity-util.git", tag = "v6.3.0" }
"@ensdomains-ens-contracts" = { version = "1.1.4", git = "https://github.com/ensdomains/ens-contracts.git", tag = "v1.1.4" }

[soldeer]
# remappings.txt is maintained by hand: the git dependencies keep their
# sources in subdirectories that soldeer's generated remappings would miss
remappings_generate = false
recursive_deps = false
