name: Release
on:
    push:
        branches:
            - main
permissions:
    actions: write
    contents: write
    id-token: write
    packages: write
    pull-requests: write
concurrency: ${{ github.workflow }}-${{ github.ref }}
jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        outputs:
            published: ${{ steps.changeset.outputs.published }}
            publishedPackages: ${{ steps.changeset.outputs.published-packages }}
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json
            - name: Setup Node.js 24
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  registry-url: "https://registry.npmjs.org"

            - name: Install Foundry
              uses: foundry-rs/foundry-toolchain@v1

            - name: Install Dependencies
              run: bun install

            - name: Create Release Pull Request
              id: changeset
              uses: changesets/action@v2
              with:
                  commit-message: "release: version packages"
                  publish-script: bun run publish-packages

    packages_to_build:
        name: Get released packages
        runs-on: ubuntu-latest
        needs: release
        if: ${{ needs.release.outputs.published == 'true' }}
        outputs:
            packages: ${{ steps.packages.outputs.PACKAGES }}
        steps:
            - name: Get released packages
              id: packages
              run: |
                  echo "PACKAGES=$(jq -c '[ .[].name ]' <(echo '${{ needs.release.outputs.publishedPackages }}'))" >> "$GITHUB_OUTPUT"

    build_contracts:
        name: Build contracts
        needs: [release, packages_to_build]
        if: ${{ needs.release.outputs.published == 'true' && contains(fromJSON(needs.packages_to_build.outputs.packages), '@sunodo/contracts') }}
        uses: ./.github/workflows/contracts.yaml
        secrets: inherit
        with:
            release: true

    build_car_sync:
        name: Build car-sync
        needs: [release, packages_to_build]
        if: ${{ needs.release.outputs.published == 'true' && contains(fromJSON(needs.packages_to_build.outputs.packages), '@sunodo/car-sync') }}
        uses: ./.github/workflows/car-sync.yaml
        secrets: inherit
        with:
            release: true
